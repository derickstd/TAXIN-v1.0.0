{% extends "base.html" %}
{% block title %}Delete User{% endblock %}
{% block content %}
<div style="max-width:560px;margin:3rem auto;padding:2rem;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);">
  <h1 style="margin:0 0 .75rem;font-size:1.4rem;color:#1A3C6E;">Delete User</h1>
  <p style="margin:0 0 1rem;color:#4b5563;">This will permanently remove <strong>{{ user.get_full_name|default:user.username }}</strong> from the system.</p>
  <form method="post">
    {% csrf_token %}
    <div style="display:flex;gap:.75rem;flex-wrap:wrap;">
      <button type="submit" style="background:#b91c1c;color:#fff;border:none;padding:.75rem 1rem;border-radius:8px;font-weight:700;cursor:pointer;">
        <i class="fas fa-trash"></i> Delete User
      </button>
      <a href="{% url 'core:admin_users' %}" style="background:#e5e7eb;color:#374151;padding:.75rem 1rem;border-radius:8px;text-decoration:none;font-weight:700;">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
