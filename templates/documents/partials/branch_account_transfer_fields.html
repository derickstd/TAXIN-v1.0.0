<div class="form-grid-2">
  {% for field in form %}
  <div>
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-hint">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="err-msg">{{ error }}</div>{% endfor %}
  </div>
  {% endfor %}
</div>
{% for error in form.non_field_errors %}<div class="err-msg">{{ error }}</div>{% endfor %}
